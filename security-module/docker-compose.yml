version: '3.8'

services:
  security-app:
    build: .
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=task4
      - SECRETS_BASE_URL=http://localhost:8084
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/task-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

