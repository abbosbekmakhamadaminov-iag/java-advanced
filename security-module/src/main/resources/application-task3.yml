# Task 3: Advanced Security (40 points)
# Steps 7-11: Role-based access + custom login/logout + brute force protection

spring:
    
  datasource:
    url: jdbc:h2:mem:securitydb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    
  h2:
    console:
      enabled: true
      path: /h2-console

# Brute force protection settings
security:
  brute-force:
    max-attempts: 3
    lock-duration-minutes: 5

info:
  task:
    number: 3
    description: "Advanced Security"
    points: 40
    features:
      - "Role-based access with permissions"
      - "Custom Login/Logout pages"
      - "Brute Force protection"
      - "Blocked users endpoint"