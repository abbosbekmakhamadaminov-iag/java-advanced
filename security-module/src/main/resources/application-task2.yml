spring:
    
  datasource:
    url: jdbc:h2:mem:securitydb
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    
  h2:
    console:
      enabled: true
      path: /h2-console

