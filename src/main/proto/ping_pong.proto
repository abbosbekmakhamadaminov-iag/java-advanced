syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.epam.javadvanced.proto";
option java_outer_classname = "PingPongProto";

package pingpong;

service PingPongService {
  rpc SendPing (PingRequest) returns (PongResponse);
}

message PingRequest {
  string message = 1;
  int64 timestamp = 2;
  string client_id = 3;
}

message PongResponse {
  string message = 1;
  int64 timestamp = 2;
  string server_id = 3;
  bool success = 4;
}