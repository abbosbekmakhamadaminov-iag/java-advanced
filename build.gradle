plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.epam.javadvanced'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	dependencies {
		// Common dependencies for all subprojects
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

// Configure Spring Boot for specific modules
configure([project(':crud-service'), project(':etl-service'), project(':security-module')]) {
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'
}

// Configure shared-models as a library (not a Spring Boot application)
project(':shared-models') {
	apply plugin: 'io.spring.dependency-management'
}

